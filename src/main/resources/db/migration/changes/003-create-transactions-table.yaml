databaseChangeLog:
  - changeSet:
      id: 003-create-transactions-table
      author: andrey
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: transactions
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: destination_card_id
                  type: BIGINT
              - column:
                  name: source_card_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: destination_card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_transaction_destination_card
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: source_card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_transaction_source_card
