databaseChangeLog:
  - changeSet:
      id: 004-change-cart-number-name
      author: andrey
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: cards
            columnName: card_number_encrypted
      changes:
        - renameColumn:
            tableName: cards
            oldColumnName: card_number
            newColumnName: card_number_encrypted
            columnDataType: VARCHAR(255)
