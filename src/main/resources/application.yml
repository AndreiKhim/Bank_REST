spring:
  application:
    name: Bank_REST

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bank_rest_db}?useSSL=false&serverTimezone=UTC
    username: ${DB_USER:bestuser}
    password: ${DB_PASSWORD:bestuser}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  liquibase:
    change-log: classpath:db/migration/changelog-master.yaml
    enabled: true

# Настройки лимитов и срока действия карт + cors
app:
  card:
    default:
      expiration-years: ${CARD_EXPIRATION_YEARS:3}
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000

# Метрики и экспозиция эндпоинтов
management:
  endpoints:
    web:
      exposure:
        include: env

# Логирование
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework: DEBUG
    org.springdoc: DEBUG

# Настройки обработки ошибок
server:
  error:
    include-message: never
    include-stacktrace: never

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html